services:
  - type: web
    name: tecnopos
    runtime: node
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_ON_BOOT
        value: true
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://tecnopos.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: tecnopos@wwtecno.com
      - key: BREVO_SENDER_NAME
        value: TecnoPOS
